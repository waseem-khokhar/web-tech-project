<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Everyday Edit - Login</title>
  <link rel="stylesheet" href="login.css">
</head>
<body>

  <div class="container">

    <header>
      <div class="logo">Everyday Edit</div>
      <nav>
        <ul>
          <li><a href="index.html">Home</a></li>
          <li><a href="media.html">Media and Info</a></li>
          <li><a href="register.html">Register</a></li>
          <li><a href="services.html">Services</a></li>
          <li><a href="portfolio.html">Portfolio</a></li>
          <li><a href="contact.html">Contact</a></li>
          <li><a href="login.html">Login</a></li>
        </ul>
      </nav>
    </header>

    <div class="form-heading">
      <h1>Member Login</h1>
      <p class="intro">Welcome back. Enter your email and password to log in.</p>
    </div>

    <form class="login-form" action="#" method="post">

      <div class="form-row">
        <label for="email" class="required">Email</label>
        <input type="email" id="email" name="email" placeholder="you@example.com" required>
      </div>

      <div class="form-row">
        <label for="password" class="required">Password</label>
        <input type="password" id="password" name="password" placeholder="Your password" required>
      </div>

      <p id="login-message"></p>

      <input type="submit" value="Log In">

      <p class="account-link">
        New here? <a href="register.html">Create an account</a>
      </p>

    </form>

    <footer>
      <p>&copy; Everyday Edit - A sample boutique</p>
    </footer>

  </div>

  <script src="login.js"></script>
</body>
</html>
